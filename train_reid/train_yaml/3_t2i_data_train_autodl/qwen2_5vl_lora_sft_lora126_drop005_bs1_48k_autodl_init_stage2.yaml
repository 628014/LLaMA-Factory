### model
model_name_or_path: /root/autodl-tmp/output/home/wangrui/code/LLaMA-Factory/output/qwen2_5vl_stage2_init_model
trust_remote_code: true
# 【显存优化】4090 跑 4096 长度必须开 4bit 量化
quantization_bit: 4
# 【精度权衡】ReID 不需要极高像素，但不能太低。128000 ≈ 360x360，对 ReID 足够，且省显存
image_max_pixels: 128000

### method
stage: sft
do_train: true
finetuning_type: lora
# 【提点技巧 1】ReID 需要记忆细节，64 rank 可能略低，提升到 128 能捕获更多细微特征
lora_rank: 64
# 【提点技巧 1】Alpha 通常设为 Rank 的 2 倍，增强 LoRA 的更新权重
lora_alpha: 128
lora_target: all
lora_dropout: 0.05
# 【提点技巧 2】开启 NEFTune 噪声，显著提升指令微调的泛化能力，防止死记硬背
# neftune_noise_alpha: 5

### dataset
dataset: mllm_reid_cuhk_16k_unified_autodl, mllm_reid_icfg_16k_unified_autodl, mllm_reid_rstp_16k_unified_autodl
template: qwen2_vl
# 【关键修复】容纳 10 张图 + 对话
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: saves/qwen2_5vl-7b/lora/sft_retpreid/lora128_with_progressive_48k_full_autodl_init_stage2
logging_steps: 5
save_steps: 5000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
# 【显存优化】必须为 1
per_device_train_batch_size: 1
# 【梯度质量】因为 batch=1，必须累计梯度。1*16 = 等效 Batch 16，更稳定
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
# 【显存优化】必须开启，以时间换空间
gradient_checkpointing: true
# 【显存优化】使用 Paged AdamW 优化器，在显存紧张时会将优化器状态转移到内存，防止 OOM
optim: paged_adamw_32bit

### eval
# 建议关闭边训边测以节省显存，训练完再单独测
# val_size: 0.1
# eval_strategy: no